[project]
name = "ats-backend"
version = "0.1.0"
description = "Automated Trading System backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "scikit-learn",
    "torch==2.5.1+cu121",
    "mlflow",
    "psycopg[binary]",
    "sqlalchemy",
    "ipykernel",
    "jupyter",
    "notebook",
    "finmind",
    "pandas",
    "numpy",
    "seaborn",
    "tqdm"
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
